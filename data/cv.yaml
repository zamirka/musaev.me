name: Замир Мусаев
headline: Head of Digital Product Development
roles:
  - Директор по информационным технологиям (CIO)
  - Технический директор (CTO)
location: Москва
experience_since: 2004
format: на месте работодателя, удалённо
relocation: не готов к переезду, готов к редким командировкам

summary: >-
  Больше двадцати лет в IT: от сисадмина в университетском кампусе до архитектора
  программных решений в международной компании и руководителя разработки в Интерфаксе.
  Знаю разработку изнутри и снаружи, умею ставить продуктовые и проектные процессы на поток.
  Работаю с чётко расставленными приоритетами и обозримыми целями, двигаю команды и продукты
  к результатам в интересах бизнеса.

about:
  - Почти всегда делаю чуть больше, чем предполагает моя официальная позиция.
  - >-
    Довольно хорошо разбираюсь в управлении проектами и продуктами. Хорошо знаю разработку
    изнутри и снаружи. Могу организовать и поставить эти деятельности на поток.
  - >-
    Разбираюсь в управлении персоналом, бюджетировании и немного в финансах. Активно использую
    эти знания для организации работы своей и вверенного мне участка.
  - >-
    Люблю инновации, хорошо организованные процессы, мотивированные команды и вдохновлённых людей.
    Прикладываю много сил для организации такой среды вокруг себя.

qualities: [добродетель, дисциплина, справедливость, смелость, спокойствие]

skills:
  - Управление продуктом
  - Управление проектами
  - Управление рисками
  - Управление коммуникациями
  - Управление изменениями

