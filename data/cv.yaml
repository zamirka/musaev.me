name: Замир Мусаев
headline: Руководитель разработки и развития цифровых продуктов
roles:
  - Директор по информационным технологиям (CIO)
  - Технический директор (CTO)
location: Москва
experience_since: 2004
format: на месте работодателя, удалённо
relocation: не готов к переезду, готов к редким командировкам

summary: >-
  В IT с 2004 года. Начинал сисадмином, работал разработчиком, архитектором и руководителем
  проектов. Сейчас руковожу ИТ-подразделениями в Интерфаксе. Занимаюсь организацией команд
  и поставки продукта, участвую в проектировании систем.

about:
  - >-
    Смотрю на работу шире своих формальных обязанностей. Если что-то можно сделать лучше,
    сам предлагаю помощь и берусь за реализацию.
  - >-
    Разбираюсь в российском фондовом рынке и понимаю смысл финансовых данных,
    с которыми работает RUDATA.
  - >-
    Люблю инновации, хорошо организованные процессы, мотивированные команды и вдохновлённых людей.
    Стремлюсь создавать такую среду вокруг себя.

qualities: [добродетель, дисциплина, справедливость, смелость, спокойствие]

skills:
  - Управление командами разработки
  - Продуктовое планирование и работа с пользователями
  - Бизнес- и системный анализ
  - Проектирование информационных систем
  - Управление проектами, бюджетами и рисками
  - Организация поставки продукта и внедрение процессов

positions:
  - org: Интерфакс
    short: Интерфакс
    site: interfax.ru
    role: Директор департамента информационных технологий RuData; руководитель центра информационных технологий «Новостные продукты»
    roles:
      - Директор департамента информационных технологий RuData
      - Руководитель центра информационных технологий «Новостные продукты»
    pdf_detail: true
    from: 2017-04
    to:
    featured: true
    industry: Информационные технологии, СМИ, медиааналитика
    body:
      - >-
        Пришёл руководителем проекта/продукта: автоматизировать работу редакции и развивать
        технологии платных подписных лент. В 2022 году в мой контур вошёл СКАН, в 2024-м – RUDATA.
    scope: >-
      Руковожу командами RUDATA и СКАН через их руководителей: в общей сложности 101 человек,
      из них 41 в RUDATA и 60 в СКАНе. СКАН относится к центру ИТ «Новостные продукты».
      В новостном направлении занимаюсь координацией и экспертной работой.
    areas:
      - name: RUDATA
        period: в контуре с 2024 года
        body:
          - >-
            Выделил вторую линию поддержки в отдельную функцию. Организовал обучение команды
            и внедрение SDLC на основе SAFe: циклы планирования, цели спринтов и PI,
            контроль выполнения и синхронизацию команд.
        highlights:
          - Команда перешла к ежемесячной поставке значимых улучшений продукта.
          - >-
            Обращения по итогам торгов, прежде почти ежедневные, стали редкими. Разобрали причины
            проблем, переписали ответственные модули, дали поддержке мониторинг и наладили
            взаимодействие с биржей.
          - >-
            Обновили серверы, развернули Kubernetes и перешли на GitLab CI/CD. Сформировали команду
            тестирования из трёх человек; используем модульные тесты и постепенно расширяем автоматизацию.
      - name: СКАН
        period: в контуре с 2022 года
        body:
          - >-
            Перестроил процесс поставки вокруг общей канбан-доски, чтобы видеть задержки и возвраты
            задач. Перешли от кросс-функциональных команд к доменам с ответственными за их развитие.
            Пересмотрел встречи и состав команд, организовал найм недостающих специалистов
            и начал внедрение автоматизации тестирования.
        highlights:
          - >-
            У новых команд появилась ответственность за свои домены и мотивация их развивать.
            Обсуждение проблем перестало сводиться к поиску виноватых.
          - >-
            Восстановление экспертизы помогло быстрее разрешать инциденты.
            По мере модернизации доменов их количество стало снижаться.
          - >-
            Ввели процессы управления инцидентами, метрики доступности и восстановления,
            критерии готовности и завершения на этапах поставки – DoR и DoD.
      - name: Новостные и редакционные системы
        period: работа над направлением с 2017 года
        body:
          - >-
            Руководил автоматизацией работы редакций и технологическим развитием платных подписных
            лент. Участвовал в проектировании, писал постановки, документы и схемы, проводил
            custdev-интервью. Управлял проектом, бюджетами и рисками, готовил дорожную карту
            и согласовывал её с владельцем продукта. Отвечал за результат перед руководством и акционерами.
        highlights:
          - >-
            Организовал поэтапный перевод около четырёх крупных редакций и двадцати подредакций
            на новую систему подготовки и выпуска новостей. Через рабочую группу представителей
            редакций согласовывали процессы и собирали обратную связь.
          - >-
            Пилотирование началось в 2019 году, полноценный перевод – в 2021-м.
            После доработок переход завершили в 2025 году.
          - >-
            Редакции получили конвейер выпуска и совместной работы с автоматизацией разметки.
            Метаданные позволяют использовать финансово-экономические новости в автоматизированных
            моделях. Около 30% финансово-экономических новостей пишутся роботами.
        products:
          - новостной терминал и шлюз доставки новостей

  - org: РосБизнесКонсалтинг
    short: РБК
    site: rbc.ru
    role: Менеджер проекта, технический директор
    project: search.public.ru
    pdf_detail: true
    from: 2015-04
    to: 2017-04
    featured: true
    industry: Информационные технологии, СМИ
    body:
      - >-
        После покупки Public.ru пришёл менеджером проекта: стабилизация сервиса, пересмотр и
        перестроение бизнес- и технологических процессов, оптимизация команды.
      - >-
        Технологически сложный сервис: нетривиальная обработка данных из разнородных источников,
        более 200 000 документов в базу ежедневно, семантический и объектный поиск (экстракция
        сущностей, дубли на шинглах, связи сущностей, тональность), поиск на основе Apache Lucene.
      - Управление интеграцией с партнёрами, вынос части производства на аутсорсинг, модернизация архитектуры и аппаратной базы.
    highlights:
      - Доступность сервиса с 85% и еженедельных инцидентов до стабильных 98,5%.
      - Время поставки нового функционала сокращено с месяца до двух недель.
      - Время решения задач поддержки сокращено с трёх месяцев до недели.
      - >-
        Подключение источников из минуса в плюс: теряли около 100 источников в месяц, пришли
        к подключению минимум 60 новых.
      - Выход из существенной операционной убыточности почти в ноль.

