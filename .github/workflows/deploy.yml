name: Сборка и публикация

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # раз в неделю, чтобы данные GitHub на странице проектов не устаревали
    - cron: "17 5 * * 1"

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Установить Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.163.3"
          extended: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Собрать сайт
        env:
          # поднимает лимит GitHub API при сборе данных о репозиториях
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: hugo --minify

      - name: Собрать PDF резюме
        run: |
          npx playwright install --with-deps chromium
          npm run cv:pdf

      - name: Выложить на Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=musaev-me --branch=main
